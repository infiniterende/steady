<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6B705C">
<title>Offline — Steady</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f1eb;color:#40453a;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px;text-align:center}
  .card{max-width:340px}
  .logo{width:56px;height:56px;border-radius:16px;background:#6b705c;color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 18px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#6f6a62;line-height:1.5;margin:0 0 20px;font-size:15px}
  button{background:#6b705c;color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo">st</div>
  <h1>You're offline</h1>
  <p>Steady needs a connection to load your plan. Your data is safe. Try again when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
